<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streaming Net - Películas y Series</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #131b2e;
      --primary-blue: #0075ff;
      --accent-cyan: #00d2ff;
      --text-color: #ffffff;
      --gray-text: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      overflow-x: hidden;
    }

    .navbar {
      position: fixed; top: 0; left: 0; width: 100%; height: 70px;
      padding: 0 4%; display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(to bottom, rgba(11, 15, 25, 0.9) 0%, rgba(11, 15, 25, 0) 100%);
      z-index: 100; transition: background-color 0.3s;
    }
    .navbar.scrolled { background-color: var(--bg-color); border-bottom: 1px solid #1e293b; }

    .logo {
      color: var(--accent-cyan); font-size: 24px; font-weight: bold;
      text-transform: uppercase; letter-spacing: 2px; cursor: pointer;
      text-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
    }

    .nav-links { display: flex; gap: 20px; align-items: center; }
    .nav-btn {
      background: transparent; color: var(--text-color); border: none;
      cursor: pointer; font-size: 14px; font-weight: 500; transition: color 0.2s;
    }
    .nav-btn.active, .nav-btn:hover { color: var(--accent-cyan); font-weight: bold; }

    .search-box-nav {
      display: flex; background: rgba(19, 27, 46, 0.8);
      border: 1px solid #1e293b; border-radius: 6px; padding: 5px 12px; align-items: center;
    }
    .search-input-nav {
      background: transparent; border: none; color: #fff; outline: none; font-size: 13px; width: 180px;
    }

    .hero {
      position: relative; height: 70vh; width: 100%;
      background-size: cover; background-position: center top;
      display: flex; align-items: center; padding: 0 4%; margin-bottom: 30px;
    }
    .hero::after {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(77deg, rgba(11,15,25,0.95) 0%, rgba(11,15,25,0.2) 50%),
                  linear-gradient(to top, var(--bg-color) 0%, rgba(11,15,25,0) 60%);
      z-index: 1;
    }
    .hero-content { position: relative; z-index: 2; max-width: 600px; }
    .hero-title { font-size: 40px; font-weight: 800; margin-bottom: 15px; }
    .hero-desc { font-size: 14px; color: var(--gray-text); line-height: 1.4; margin-bottom: 20px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

    .btn-play {
      background: linear-gradient(135deg, var(--accent-cyan), var(--primary-blue));
      color: #fff; border: none; padding: 10px 24px; border-radius: 6px;
      font-weight: bold; font-size: 15px; cursor: pointer; transition: transform 0.2s;
    }
    .btn-play:hover { transform: translateY(-2px); }

    .catalog-container { padding: 0 4%; margin-bottom: 50px; }
    .row-section { margin-bottom: 35px; }
    .row-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .row-title { font-size: 18px; font-weight: 700; border-left: 3px solid var(--accent-cyan); padding-left: 10px; }

    .row-posters { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 15px; }
    .row-posters::-webkit-scrollbar { height: 6px; }
    .row-posters::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }

    .card {
      flex: 0 0 170px; height: 255px; background-color: var(--card-bg);
      border-radius: 8px; overflow: hidden; cursor: pointer; position: relative;
      transition: transform 0.3s, box-shadow 0.3s; border: 1px solid #1e293b;
    }
    .card:hover { transform: scale(1.05); box-shadow: 0 10px 25px rgba(0, 117, 255, 0.3); border-color: var(--accent-cyan); }
    .card img { width: 100%; height: 100%; object-fit: cover; }
    .card-title-overlay {
      position: absolute; bottom: 0; left: 0; width: 100%; padding: 10px;
      background: linear-gradient(to top, rgba(11,15,25,0.95), transparent);
      font-size: 12px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 8, 15, 0.95); z-index: 1000; overflow-y: auto; backdrop-filter: blur(5px);
    }
    .modal-content {
      position: relative; width: 90%; max-width: 900px; margin: 30px auto;
      background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid #1e293b;
    }
    .close-btn {
      position: absolute; top: 15px; right: 20px; color: #fff; font-size: 28px;
      cursor: pointer; z-index: 1001; background: rgba(30, 41, 59, 0.8);
      width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    }

    .server-selector {
      display: flex; gap: 8px; padding: 12px; background: #0f172a;
      justify-content: center; flex-wrap: wrap; border-bottom: 1px solid #1e293b;
    }
    .server-btn {
      background: #1e293b; color: #94a3b8; border: 1px solid #334155;
      padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;
    }
    .server-btn.active { background: var(--primary-blue); color: #fff; border-color: var(--accent-cyan); }

    .iframe-wrapper { position: relative; width: 100%; height: 480px; background: #000; }
    iframe, video { width: 100%; height: 100%; border: none; display: block; }

    .series-panel { padding: 20px; background: #0b0f19; border-top: 1px solid #1e293b; }
    .season-select { background: #1e293b; color: #fff; border: 1px solid #334155; padding: 6px 12px; border-radius: 6px; }
    .episodes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; max-height: 180px; overflow-y: auto; margin-top: 15px; }
    .ep-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 8px; border-radius: 6px; cursor: pointer; text-align: center; font-size: 12px; }
    .ep-btn.active { background: var(--primary-blue); color: #fff; border-color: var(--accent-cyan); }
  </style>
</head>
<body>

  <div class="navbar" id="navbar">
    <div class="logo" onclick="location.reload()">StreamingNet</div>
    <div class="nav-links">
      <button class="nav-btn active" onclick="cambiarModo('movie')">Películas</button>
      <button class="nav-btn" onclick="cambiarModo('tv')">Series</button>
      <div class="search-box-nav">
        <input type="text" id="searchInput" class="search-input-nav" placeholder="Buscar..." onkeypress="if(event.key==='Enter') buscarContenido(this.value)">
      </div>
    </div>
  </div>

  <div id="mainHomeView">
    <div class="hero" id="heroBanner">
      <div class="hero-content">
        <h1 class="hero-title" id="heroTitle">Cargando...</h1>
        <p class="hero-desc" id="heroDesc">Selecciona un título para iniciar la reproducción.</p>
        <button class="btn-play" id="heroPlayBtn">▶ Reproducir Ahora</button>
      </div>
    </div>

    <div class="catalog-container" id="catalogContainer"></div>
  </div>

  <div id="playerModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="cerrarReproductor()">&times;</span>
      <div id="serverContainer" class="server-selector"></div>

      <div class="iframe-wrapper">
        <video id="videoPlayer" controls style="display:none;"></video>
        <iframe id="embedFrame" src="" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
      </div>

      <div id="seriesPanel" class="series-panel" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span id="seriesTitle" style="font-size: 16px; font-weight: bold; color: var(--accent-cyan);">Episodios</span>
          <select id="seasonSelect" class="season-select" onchange="seleccionarTemporada(this.value)"></select>
        </div>
        <div id="episodesGrid" class="episodes-grid"></div>
      </div>
    </div>
  </div>

  <script>
    const TMDB_API_KEY = "76fac3ba42f8bf2c76af4114610465da";

    // Servidores de Respaldo Potentes
    const SERVIDORES_TMDB = [
      { 
        nombre: "Servidor 1 (AutoEmbed - Opción Latina/Sub)", 
        getMovie: (id) => `https://player.autoembed.cc/embed/movie/${id}`, 
        getTv: (id, s, e) => `https://player.autoembed.cc/embed/tv/${id}/${s}/${e}` 
      },
      { 
        nombre: "Servidor 2 (VidSrc.cc)", 
        getMovie: (id) => `https://vidsrc.cc/v2/embed/movie/${id}`, 
        getTv: (id, s, e) => `https://vidsrc.cc/v2/embed/tv/${id}/${s}/${e}` 
      },
      { 
        nombre: "Servidor 3 (VidSrc.to)", 
        getMovie: (id) => `https://vidsrc.to/embed/movie/${id}`, 
        getTv: (id, s, e) => `https://vidsrc.to/embed/tv/${id}/${s}/${e}` 
      },
      { 
        nombre: "Servidor 4 (SuperEmbed)", 
        getMovie: (id) => `https://multembed.mov/?video_id=${id}&tmdb=1`, 
        getTv: (id, s, e) => `https://multembed.mov/?video_id=${id}&tmdb=1&s=${s}&e=${e}` 
      },
      { 
        nombre: "Servidor 5 (Embed.su)", 
        getMovie: (id) => `https://embed.su/embed/movie/${id}`, 
        getTv: (id, s, e) => `https://embed.su/embed/tv/${id}/${s}/${e}` 
      }
    ];

    let modoActual = 'movie';
    let itemActivo = null;
    let servidoresDisponibles = [];
    let servidorActivoIdx = 0;
    let temporadaActiva = 1;
    let episodioActivo = 1;
    let hlsInstance = null;

    async function inicializarApp() {
      await cargarBannerHero();
      await cargarCarruselesCategorias();
    }

    async function cargarBannerHero() {
      try {
        const endpoint = modoActual === 'movie' ? 'movie' : 'tv';
        const res = await fetch(`https://api.themoviedb.org/3/${endpoint}/popular?api_key=${TMDB_API_KEY}&language=es-MX`);
        const data = await res.json();
        if (data.results && data.results.length > 0) {
          const destacado = data.results[0];
          document.getElementById('heroBanner').style.backgroundImage = `url(https://image.tmdb.org/t/p/original${destacado.backdrop_path})`;
          document.getElementById('heroTitle').innerText = destacado.title || destacado.name;
          document.getElementById('heroDesc').innerText = destacado.overview || "Sin descripción disponible.";
          document.getElementById('heroPlayBtn').onclick = () => abrirReproductor(destacado);
        }
      } catch (err) {}
    }

    async function cargarCarruselesCategorias() {
      const container = document.getElementById('catalogContainer');
      container.innerHTML = '';
      const categorias = [
        { id: 'popular', nombre: 'Tendencias' },
        { id: 'top_rated', nombre: 'Mejor Valoradas' }
      ];

      for (const cat of categorias) {
        const rowSection = document.createElement('div');
        rowSection.className = 'row-section';
        rowSection.innerHTML = `<div class="row-header"><h2 class="row-title">${cat.nombre}</h2></div>`;

        const rowPosters = document.createElement('div');
        rowPosters.className = 'row-posters';

        const endpoint = modoActual === 'movie' ? 'movie' : 'tv';
        const res = await fetch(`https://api.themoviedb.org/3/${endpoint}/${cat.id}?api_key=${TMDB_API_KEY}&language=es-MX`);
        const data = await res.json();

        if (data.results) {
          data.results.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => abrirReproductor(item);
            const titulo = item.title || item.name;
            const poster = item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : 'https://via.placeholder.com/500x750';
            card.innerHTML = `<img src="${poster}"><div class="card-title-overlay">${titulo}</div>`;
            rowPosters.appendChild(card);
          });
        }
        rowSection.appendChild(rowPosters);
        container.appendChild(rowSection);
      }
    }

    function cambiarModo(nuevoModo) {
      modoActual = nuevoModo;
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.toggle('active', btn.innerText.toLowerCase().includes(nuevoModo === 'movie' ? 'películas' : 'series')));
      inicializarApp();
    }

    async function abrirReproductor(item) {
      itemActivo = item;
      servidorActivoIdx = 0;
      document.getElementById('playerModal').style.display = 'block';

      servidoresDisponibles = [];
      try {
        const resBackend = await fetch(`/api/contenido/${item.id}`);
        if (resBackend.ok) {
          const dataBackend = await resBackend.json();
          if (dataBackend.success && dataBackend.data) {
            servidoresDisponibles.push({
              nombre: "⭐ Servidor VIP Directo (Extraído)",
              isBackend: true,
              backendId: dataBackend.data.id
            });
          }
        }
      } catch (e) {}

      SERVIDORES_TMDB.forEach(srv => servidoresDisponibles.push({ ...srv, isBackend: false }));
      renderizarBotonesServidores();

      if (modoActual === 'movie') {
        document.getElementById('seriesPanel').style.display = 'none';
        actualizarIframe();
      } else {
        document.getElementById('seriesPanel').style.display = 'block';
        document.getElementById('seriesTitle').innerText = item.name || "Serie";
        await cargarEstructuraSerie(item.id);
      }
    }

    function renderizarBotonesServidores() {
      const container = document.getElementById('serverContainer');
      container.innerHTML = '';
      servidoresDisponibles.forEach((srv, idx) => {
        const btn = document.createElement('button');
        btn.className = `server-btn ${idx === servidorActivoIdx ? 'active' : ''}`;
        btn.innerText = srv.nombre;
        btn.onclick = () => {
          servidorActivoIdx = idx;
          document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          actualizarIframe();
        };
        container.appendChild(btn);
      });
    }

    async function actualizarIframe() {
      const iframe = document.getElementById('embedFrame');
      const videoPlayer = document.getElementById('videoPlayer');
      const srv = servidoresDisponibles[servidorActivoIdx];

      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }

      if (srv && srv.isBackend) {
        iframe.style.display = 'none';
        videoPlayer.style.display = 'block';

        try {
          const res = await fetch(`/api/resolve-stream/${srv.backendId}`);
          const streamData = await res.json();

          if (streamData.success) {
            const { streamUrl, type, headers } = streamData.data;
            const proxyUrl = `/api/proxy-stream?url=${encodeURIComponent(streamUrl)}&referer=${encodeURIComponent(headers?.Referer || '')}`;

            if (type === 'hls') {
              if (Hls.isSupported()) {
                hlsInstance = new Hls();
                hlsInstance.loadSource(proxyUrl);
                hlsInstance.attachMedia(videoPlayer);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => videoPlayer.play());
              } else {
                videoPlayer.src = proxyUrl;
                videoPlayer.play();
              }
            } else {
              videoPlayer.src = proxyUrl;
              videoPlayer.play();
            }
          } else {
            alert("El servidor VIP no pudo extraer la transmisión. Cambia a otro servidor de la lista.");
          }
        } catch (err) {
          alert("Error de conexión al extraer la fuente.");
        }
      } else if (srv) {
        videoPlayer.pause();
        videoPlayer.style.display = 'none';
        iframe.style.display = 'block';

        let targetUrl = modoActual === 'movie' 
          ? srv.getMovie(itemActivo.id) 
          : srv.getTv(itemActivo.id, temporadaActiva, episodioActivo);

        iframe.src = targetUrl;
      }
    }

    async function cargarEstructuraSerie(seriesId) {
      const selectTemp = document.getElementById('seasonSelect');
      selectTemp.innerHTML = '<option>Cargando...</option>';
      try {
        const res = await fetch(`https://api.themoviedb.org/3/tv/${seriesId}?api_key=${TMDB_API_KEY}&language=es-MX`);
        const data = await res.json();
        selectTemp.innerHTML = '';
        const temporadasValidas = (data.seasons || []).filter(s => s.season_number > 0);

        if (temporadasValidas.length > 0) {
          temporadasValidas.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.season_number;
            opt.innerText = `Temporada ${s.season_number}`;
            selectTemp.appendChild(opt);
          });
          temporadaActiva = temporadasValidas[0].season_number;
          await seleccionarTemporada(temporadaActiva);
        }
      } catch (err) {}
    }

    async function seleccionarTemporada(numTemporada) {
      temporadaActiva = parseInt(numTemporada);
      const gridEps = document.getElementById('episodesGrid');
      gridEps.innerHTML = '';
      try {
        const res = await fetch(`https://api.themoviedb.org/3/tv/${itemActivo.id}/season/${temporadaActiva}?api_key=${TMDB_API_KEY}&language=es-MX`);
        const data = await res.json();

        if (data.episodes) {
          data.episodes.forEach(ep => {
            const btn = document.createElement('button');
            btn.className = `ep-btn ${ep.episode_number === episodioActivo ? 'active' : ''}`;
            btn.innerText = `E${ep.episode_number}: ${ep.name.substring(0, 10)}...`;
            btn.onclick = () => {
              episodioActivo = ep.episode_number;
              document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
              btn.classList.add('active');
              actualizarIframe();
            };
            gridEps.appendChild(btn);
          });
          episodioActivo = data.episodes[0].episode_number;
          actualizarIframe();
        }
      } catch (e) {}
    }

    function cerrarReproductor() {
      document.getElementById('playerModal').style.display = 'none';
      document.getElementById('embedFrame').src = '';
      const videoPlayer = document.getElementById('videoPlayer');
      videoPlayer.pause();
      videoPlayer.src = '';
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
    }

    async function buscarContenido(query) {
      const container = document.getElementById('catalogContainer');
      container.innerHTML = `<h2 class="row-title" style="margin-bottom:15px;">Resultados para: "${query}"</h2>`;
      const rowPosters = document.createElement('div');
      rowPosters.style.display = 'grid';
      rowPosters.style.gridTemplateColumns = 'repeat(auto-fill, minmax(160px, 1fr))';
      rowPosters.style.gap = '15px';

      const endpoint = modoActual === 'movie' ? 'movie' : 'tv';
      const res = await fetch(`https://api.themoviedb.org/3/search/${endpoint}?api_key=${TMDB_API_KEY}&language=es-MX&query=${encodeURIComponent(query)}`);
      const data = await res.json();

      if (data.results) {
        data.results.forEach(item => {
          const card = document.createElement('div');
          card.className = 'card';
          card.style.width = '100%';
          card.onclick = () => abrirReproductor(item);
          const titulo = item.title || item.name;
          const poster = item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : 'https://via.placeholder.com/500x750';
          card.innerHTML = `<img src="${poster}"><div class="card-title-overlay">${titulo}</div>`;
          rowPosters.appendChild(card);
        });
        container.appendChild(rowPosters);
      }
    }

    inicializarApp();
  </script>
</body>
</html>
