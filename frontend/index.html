<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streaming Net - Películas y Series (Latino)</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #131b2e;
      --primary-blue: #0075ff;
      --accent-cyan: #00d2ff;
      --text-color: #ffffff;
      --gray-text: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      overflow-x: hidden;
    }

    .navbar {
      position: fixed; top: 0; left: 0; width: 100%; height: 70px;
      padding: 0 4%; display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(to bottom, rgba(11, 15, 25, 0.9) 0%, rgba(11, 15, 25, 0) 100%);
      z-index: 100; transition: background-color 0.3s;
    }
    .navbar.scrolled { background-color: var(--bg-color); border-bottom: 1px solid #1e293b; }

    .logo {
      color: var(--accent-cyan); font-size: 24px; font-weight: bold;
      text-transform: uppercase; letter-spacing: 2px; cursor: pointer;
      text-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
    }

    .nav-links { display: flex; gap: 20px; align-items: center; }
    .nav-btn { background: transparent; color: var(--text-color); border: none; cursor: pointer; font-size: 14px; font-weight: 500; }
    .nav-btn.active, .nav-btn:hover { color: var(--accent-cyan); font-weight: bold; }

    .search-box-nav { display: flex; background: rgba(19, 27, 46, 0.8); border: 1px solid #1e293b; border-radius: 6px; padding: 5px 12px; }
    .search-input-nav { background: transparent; border: none; color: #fff; outline: none; font-size: 13px; width: 180px; }

    .hero { position: relative; height: 75vh; width: 100%; background-size: cover; background-position: center top; display: flex; align-items: center; padding: 0 4%; margin-bottom: 30px; }
    .hero::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(77deg, rgba(11,15,25,0.95) 0%, rgba(11,15,25,0.2) 50%), linear-gradient(to top, var(--bg-color) 0%, rgba(11,15,25,0) 60%); z-index: 1; }
    .hero-content { position: relative; z-index: 2; max-width: 600px; }
    .hero-title { font-size: 42px; font-weight: 800; margin-bottom: 15px; }
    .hero-desc { font-size: 15px; color: var(--gray-text); line-height: 1.4; margin-bottom: 20px; display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .hero-buttons { display: flex; gap: 12px; }

    .btn-play { background: linear-gradient(135deg, var(--accent-cyan), var(--primary-blue)); color: #fff; border: none; padding: 10px 24px; border-radius: 6px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(0, 117, 255, 0.4); }
    .btn-info { background-color: rgba(30, 41, 59, 0.8); color: #fff; border: 1px solid #334155; padding: 10px 24px; border-radius: 6px; font-weight: bold; cursor: pointer; }

    .catalog-container { padding: 0 4%; margin-bottom: 50px; }
    .row-section { margin-bottom: 35px; }
    .row-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .row-title { font-size: 18px; font-weight: 700; color: #f1f5f9; border-left: 3px solid var(--accent-cyan); padding-left: 10px; }
    .btn-ver-mas { background: transparent; border: none; color: var(--gray-text); font-size: 13px; font-weight: bold; cursor: pointer; }

    .row-posters { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 15px; }
    .row-posters::-webkit-scrollbar { height: 6px; }
    .row-posters::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }

    .card { flex: 0 0 180px; height: 270px; background-color: var(--card-bg); border-radius: 8px; overflow: hidden; cursor: pointer; position: relative; border: 1px solid #1e293b; transition: transform 0.3s; }
    .card:hover { transform: scale(1.05); border-color: var(--accent-cyan); }
    .card img { width: 100%; height: 100%; object-fit: cover; }
    .card-title-overlay { position: absolute; bottom: 0; left: 0; width: 100%; padding: 15px 10px 10px; background: linear-gradient(to top, rgba(11,15,25,0.95), transparent); font-size: 13px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 8, 15, 0.95); z-index: 1000; overflow-y: auto; backdrop-filter: blur(5px); }
    .modal-content { position: relative; width: 90%; max-width: 900px; margin: 30px auto; background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid #1e293b; }
    .close-btn { position: absolute; top: 15px; right: 20px; color: #fff; font-size: 28px; cursor: pointer; z-index: 1001; background: rgba(30, 41, 59, 0.8); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

    .server-selector { display: flex; gap: 8px; padding: 12px; background: #0f172a; justify-content: center; flex-wrap: wrap; border-bottom: 1px solid #1e293b; }
    .server-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
    .server-btn.active { background: var(--primary-blue); color: #fff; border-color: var(--accent-cyan); }

    .quick-toolbar { background: #0b0f19; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--gray-text); border-bottom: 1px solid #1e293b; }
    .action-btn { background: var(--primary-blue); color: #fff; text-decoration: none; padding: 6px 14px; border-radius: 6px; font-weight: bold; font-size: 12px; }

    .iframe-wrapper { position: relative; width: 100%; height: 480px; background: #000; }
    iframe, video { width: 100%; height: 100%; border: none; display: block; }

    @media(max-width: 768px) {
      .hero-title { font-size: 28px; }
      .card { flex: 0 0 130px; height: 195px; }
      .iframe-wrapper { height: 260px; }
    }
  </style>
</head>
<body>

  <div class="navbar" id="navbar">
    <div class="logo" onclick="location.reload()">StreamingNet</div>
    <div class="nav-links">
      <button class="nav-btn active" onclick="cambiarModo('movie')">Películas</button>
      <button class="nav-btn" onclick="cambiarModo('tv')">Series</button>
      <div class="search-box-nav">
        <input type="text" id="searchInput" class="search-input-nav" placeholder="Buscar..." onkeypress="handleKeyPress(event)">
      </div>
    </div>
  </div>

  <div id="mainHomeView">
    <div class="hero" id="heroBanner">
      <div class="hero-content">
        <h1 class="hero-title" id="heroTitle">Cargando...</h1>
        <p class="hero-desc" id="heroDesc">Selecciona un título para comenzar.</p>
        <div class="hero-buttons">
          <button class="btn-play" id="heroPlayBtn">▶ Reproducir</button>
          <button class="btn-info" id="heroInfoBtn">ℹ Información</button>
        </div>
      </div>
    </div>

    <div class="catalog-container" id="catalogContainer"></div>
  </div>

  <div id="playerModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="cerrarReproductor()">&times;</span>
      <div id="serverContainer" class="server-selector"></div>

      <div class="quick-toolbar">
        <span>💡 Selecciona un servidor alternativo si el principal no carga.</span>
        <a id="externalLink" href="#" target="_blank" class="action-btn">📺 Abrir Directo</a>
      </div>

      <div class="iframe-wrapper">
        <video id="videoPlayer" controls style="display:none;"></video>
        <iframe id="embedFrame" src="" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
      </div>
    </div>
  </div>

  <script>
    const TMDB_API_KEY = "76fac3ba42f8bf2c76af4114610465da";

    const SERVIDORES_TMDB = [
      { nombre: "AutoEmbed (Latino)", getMovie: id => `https://player.autoembed.cc/embed/movie/${id}`, getTv: (id, s, e) => `https://player.autoembed.cc/embed/tv/${id}/${s}/${e}` },
      { nombre: "Embed.su", getMovie: id => `https://embed.su/embed/movie/${id}`, getTv: (id, s, e) => `https://embed.su/embed/tv/${id}/${s}/${e}` },
      { nombre: "VidKing", getMovie: id => `https://vidking.net/embed/movie/${id}`, getTv: (id, s, e) => `https://vidking.net/embed/tv/${id}/${s}/${e}` }
    ];

    let modoActual = 'movie';
    let itemActivo = null;
    let servidoresDisponibles = [];
    let servidorActivoIdx = 0;
    let hlsInstance = null;

    async function inicializarApp() {
      await cargarBannerHero();
      await cargarCarruselesCategorias();
    }

    async function cargarBannerHero() {
      try {
        const endpoint = modoActual === 'movie' ? 'movie' : 'tv';
        const res = await fetch(`https://api.themoviedb.org/3/${endpoint}/popular?api_key=${TMDB_API_KEY}&language=es-MX`);
        const data = await res.json();
        if (data.results && data.results.length > 0) {
          const destacado = data.results[0];
          document.getElementById('heroBanner').style.backgroundImage = `url(https://image.tmdb.org/t/p/original${destacado.backdrop_path})`;
          document.getElementById('heroTitle').innerText = destacado.title || destacado.name;
          document.getElementById('heroDesc').innerText = destacado.overview || "Sin descripción.";
          document.getElementById('heroPlayBtn').onclick = () => abrirReproductor(destacado);
          document.getElementById('heroInfoBtn').onclick = () => abrirReproductor(destacado);
        }
      } catch (e) { console.error(e); }
    }

    async function cargarCarruselesCategorias() {
      const container = document.getElementById('catalogContainer');
      container.innerHTML = '';
      const categorias = [{ id: 'popular', nombre: 'Tendencias' }, { id: 'top_rated', nombre: 'Mejor Valoradas' }];

      for (const cat of categorias) {
        const rowSection = document.createElement('div');
        rowSection.className = 'row-section';
        rowSection.innerHTML = `<div class="row-header"><h2 class="row-title">${cat.nombre}</h2></div>`;
        const rowPosters = document.createElement('div');
        rowPosters.className = 'row-posters';

        const endpoint = modoActual === 'movie' ? 'movie' : 'tv';
        const res = await fetch(`https://api.themoviedb.org/3/${endpoint}/${cat.id}?api_key=${TMDB_API_KEY}&language=es-MX`);
        const data = await res.json();

        if (data.results) {
          data.results.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => abrirReproductor(item);
            card.innerHTML = `<img src="https://image.tmdb.org/t/p/w500${item.poster_path}" alt=""><div class="card-title-overlay">${item.title || item.name}</div>`;
            rowPosters.appendChild(card);
          });
        }
        rowSection.appendChild(rowPosters);
        container.appendChild(rowSection);
      }
    }

    async function abrirReproductor(item) {
      itemActivo = item;
      servidorActivoIdx = 0;
      document.getElementById('playerModal').style.display = 'block';
      servidoresDisponibles = [];

      try {
        const resBackend = await fetch(`/api/contenido/${item.id}`);
        // Validar que la respuesta de Express sea 200 OK
        if (resBackend.ok) {
          const dataBackend = await resBackend.json();
          if (dataBackend.success && dataBackend.data) {
            servidoresDisponibles.push({
              nombre: "Servidor VIP",
              isBackend: true,
              backendId: dataBackend.data.id
            });
          }
        }
      } catch (e) {
        console.log("Servidor local no disponible para este ID.");
      }

      SERVIDORES_TMDB.forEach(srv => servidoresDisponibles.push({ ...srv, isBackend: false }));
      renderizarBotonesServidores();
      actualizarIframe();
    }

    function renderizarBotonesServidores() {
      const container = document.getElementById('serverContainer');
      container.innerHTML = '';
      servidoresDisponibles.forEach((srv, idx) => {
        const btn = document.createElement('button');
        btn.className = `server-btn ${idx === servidorActivoIdx ? 'active' : ''}`;
        btn.innerText = srv.nombre;
        btn.onclick = () => {
          servidorActivoIdx = idx;
          document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          actualizarIframe();
        };
        container.appendChild(btn);
      });
    }

    async function actualizarIframe() {
      const iframe = document.getElementById('embedFrame');
      const videoPlayer = document.getElementById('videoPlayer');
      const linkExt = document.getElementById('externalLink');
      const srv = servidoresDisponibles[servidorActivoIdx];

      if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }

      if (srv && srv.isBackend) {
        iframe.style.display = 'none';
        videoPlayer.style.display = 'block';

        try {
          const res = await fetch(`/api/resolve-stream/${srv.backendId}`);
          const streamData = await res.json();

          if (streamData.success) {
            const { streamUrl, type, headers } = streamData.data;
            const proxyUrl = `/api/proxy-stream?url=${encodeURIComponent(streamUrl)}&referer=${encodeURIComponent(headers?.Referer || '')}`;
            linkExt.href = streamUrl;

            if (type === 'hls' && Hls.isSupported()) {
              hlsInstance = new Hls();
              hlsInstance.loadSource(proxyUrl);
              hlsInstance.attachMedia(videoPlayer);
              hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => videoPlayer.play());
            } else {
              videoPlayer.src = proxyUrl;
              videoPlayer.play();
            }
          }
        } catch (err) {
          alert("No se pudo cargar la transmisión VIP.");
        }
      } else if (srv) {
        videoPlayer.pause();
        videoPlayer.style.display = 'none';
        iframe.style.display = 'block';

        const targetUrl = srv.getMovie(itemActivo.id);
        iframe.src = targetUrl;
        linkExt.href = targetUrl;
      }
    }

    function cerrarReproductor() {
      document.getElementById('playerModal').style.display = 'none';
      document.getElementById('embedFrame').src = '';
      const videoPlayer = document.getElementById('videoPlayer');
      videoPlayer.pause();
      videoPlayer.src = '';
      if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
    }

    function cambiarModo(nuevoModo) {
      modoActual = nuevoModo;
      inicializarApp();
    }

    inicializarApp();
  </script>
</body>
</html>
