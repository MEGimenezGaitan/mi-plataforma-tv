<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma de Películas y Series</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #141414; color: #fff; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #e50914; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }

    /* Pestañas de Modo (Películas / Series) */
    .mode-switch { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
    .mode-btn { background: #222; color: #fff; border: 2px solid #333; padding: 10px 25px; border-radius: 25px; cursor: pointer; font-size: 15px; font-weight: bold; transition: 0.2s; }
    .mode-btn.active, .mode-btn:hover { background: #e50914; border-color: #e50914; }

    /* Buscador */
    .search-container { display: flex; justify-content: center; margin-bottom: 15px; }
    .search-box { width: 100%; max-width: 500px; display: flex; gap: 10px; }
    .search-input { flex: 1; padding: 12px 18px; border-radius: 25px; border: 1px solid #444; background: #222; color: #fff; font-size: 14px; outline: none; }
    .search-btn { background: #e50914; color: #fff; border: none; padding: 10px 22px; border-radius: 25px; cursor: pointer; font-weight: bold; }

    /* Categorías */
    .categories { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .cat-btn { background: #222; color: #aaa; border: 1px solid #444; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: bold; transition: 0.2s; }
    .cat-btn:hover, .cat-btn.active { background: #e50914; color: #fff; border-color: #e50914; }

    .loading-info { text-align: center; font-size: 14px; color: #888; margin-bottom: 15px; }

    /* Grid (50 Elementos por página) */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; min-height: 400px; }
    .card { background: #222; border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.2s; position: relative; }
    .card:hover { transform: scale(1.04); }
    .card img { width: 100%; height: 240px; object-fit: cover; display: block; }
    .card-title { padding: 10px; font-size: 13px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge { position: absolute; top: 8px; right: 8px; background: rgba(229, 9, 20, 0.9); color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; text-transform: uppercase; }

    /* Paginación */
    .pagination { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 25px; }
    .page-btn { background: #333; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .page-btn:disabled { background: #111; color: #555; cursor: not-allowed; }
    .page-num { font-size: 14px; color: #ccc; }

    /* Modal Reproductor */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); z-index: 1000; overflow-y: auto; }
    .modal-content { position: relative; width: 92%; max-width: 950px; margin: 2% auto; background: #111; border-radius: 10px; overflow: hidden; border: 1px solid #333; }
    .close-btn { position: absolute; top: 10px; right: 18px; color: #fff; font-size: 30px; cursor: pointer; z-index: 1001; font-weight: bold; }

    /* Barra de Selección de Servidores */
    .server-selector { display: flex; gap: 8px; padding: 12px; background: #181818; justify-content: center; flex-wrap: wrap; border-bottom: 1px solid #333; }
    .server-btn { background: #282828; color: #ccc; border: 1px solid #444; padding: 7px 12px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: 600; transition: 0.2s; }
    .server-btn:hover, .server-btn.active { background: #e50914; color: #fff; border-color: #e50914; }

    /* Contenedor del Reproductor */
    iframe { width: 100%; height: 480px; border: none; background: #000; display: block; }

    /* Panel de Series (Temporadas y Episodios - Estilo XuperTV / MXL) */
    .series-panel { padding: 15px; background: #161616; border-top: 1px solid #282828; }
    .series-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
    .series-title { font-size: 16px; font-weight: bold; color: #e50914; }
    .season-select { background: #222; color: #fff; border: 1px solid #444; padding: 6px 12px; border-radius: 5px; outline: none; cursor: pointer; font-size: 14px; }
    
    .episodes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; max-height: 180px; overflow-y: auto; padding-right: 5px; }
    .ep-btn { background: #222; color: #ccc; border: 1px solid #333; padding: 8px; border-radius: 5px; cursor: pointer; text-align: center; font-size: 12px; transition: 0.2s; }
    .ep-btn:hover, .ep-btn.active { background: #e50914; color: #fff; border-color: #e50914; font-weight: bold; }
  </style>
</head>
<body>

  <h1>Plataforma TV</h1>

  <!-- Selector Películas / Series -->
  <div class="mode-switch">
    <button id="modeMovies" class="mode-btn active" onclick="cambiarModo('movie')">🎬 Películas</button>
    <button id="modeSeries" class="mode-btn" onclick="cambiarModo('tv')">📺 Series</button>
  </div>

  <!-- Buscador -->
  <div class="search-container">
    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="Buscar película o serie..." onkeypress="handleKeyPress(event)">
      <button class="search-btn" onclick="ejecutarBusqueda()">Buscar</button>
    </div>
  </div>

  <!-- Categorías -->
  <div class="categories" id="categoriesContainer"></div>

  <div id="infoCarga" class="loading-info">Cargando catálogo...</div>
  <div id="catalogo" class="grid"></div>

  <!-- Paginación -->
  <div class="pagination">
    <button id="prevBtn" class="page-btn" onclick="cambiarPagina(-1)" disabled>Anterior</button>
    <span id="pageInfo" class="page-num">Página 1</span>
    <button id="nextBtn" class="page-btn" onclick="cambiarPagina(1)">Siguiente</button>
  </div>

  <!-- Modal Reproductor -->
  <div id="playerModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="cerrarReproductor()">&times;</span>
      
      <!-- Selector de Servidores -->
      <div id="serverContainer" class="server-selector"></div>

      <!-- Iframe del Video -->
      <iframe id="embedFrame" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>

      <!-- Panel de Temporadas y Episodios (Solo Series) -->
      <div id="seriesPanel" class="series-panel" style="display: none;">
        <div class="series-header">
          <span id="seriesTitle" class="series-title">Episodios</span>
          <div>
            <label for="seasonSelect" style="font-size: 13px; color: #aaa; margin-right: 5px;">Temporada:</label>
            <select id="seasonSelect" class="season-select" onchange="seleccionarTemporada(this.value)"></select>
          </div>
        </div>
        <div id="episodesGrid" class="episodes-grid"></div>
      </div>
    </div>
  </div>

  <script>
    const TMDB_API_KEY = "76fac3ba42f8bf2c76af4114610465da";

    // 8 SERVIDORES REDUNDANTES (Películas y Series)
    const SERVIDORES = [
      {
        nombre: "Servidor 1 (VidLink)",
        getMovie: (id) => `https://vidlink.pro/movie/${id}?primaryColor=e50914&multiLang=true`,
        getTv: (id, s, e) => `https://vidlink.pro/tv/${id}/${s}/${e}?primaryColor=e50914&multiLang=true`
      },
      {
        nombre: "Servidor 2 (VidSrc CC)",
        getMovie: (id) => `https://vidsrc.cc/v2/embed/movie/${id}?autoGain=true`,
        getTv: (id, s, e) => `https://vidsrc.cc/v2/embed/tv/${id}/${s}/${e}`
      },
      {
        nombre: "Servidor 3 (Embed.su)",
        getMovie: (id) => `https://embed.su/embed/movie/${id}`,
        getTv: (id, s, e) => `https://embed.su/embed/tv/${id}/${s}/${e}`
      },
      {
        nombre: "Servidor 4 (AutoEmbed)",
        getMovie: (id) => `https://player.autoembed.cc/embed/movie/${id}?lang=es`,
        getTv: (id, s, e) => `https://player.autoembed.cc/embed/tv/${id}/${s}/${e}?lang=es`
      },
      {
        nombre: "Servidor 5 (2Embed)",
        getMovie: (id) => `https://www.2embed.cc/embed/${id}`,
        getTv: (id, s, e) => `https://www.2embed.cc/embedtv/${id}&s=${s}&e=${e}`
      },
      {
        nombre: "Servidor 6 (VidCore)",
        getMovie: (id) => `https://vidcore.org/embed/movie/${id}`,
        getTv: (id, s, e) => `https://vidcore.org/embed/series/${id}/${s}/${e}`
      },
      {
        nombre: "Servidor 7 (MultiEmbed)",
        getMovie: (id) => `https://multiembed.mov/?video_id=${id}&tmdb=1`,
        getTv: (id, s, e) => `https://multiembed.mov/?video_id=${id}&tmdb=1&s=${s}&e=${e}`
      },
      {
        nombre: "Servidor 8 (SmashyStream)",
        getMovie: (id) => `https://embed.smashystream.com/playere.php?tmdb=${id}`,
        getTv: (id, s, e) => `https://embed.smashystream.com/playere.php?tmdb=${id}&season=${s}&episode=${e}`
      }
    ];

    // Estado global de la app
    let modoActual = 'movie'; // 'movie' o 'tv'
    let categoriaActual = 'populares';
    let busquedaActual = '';
    let paginaActual = 1;

    // Estado del elemento activo en el reproductor
    let itemActivo = null;
    let servidorActivoIdx = 0;
    let temporadaActiva = 1;
    let episodioActivo = 1;

    // Categorías TMDB
    const generosPeliculas = [
      { id: 'populares', nombre: 'Populares' },
      { id: 28, nombre: 'Acción' },
      { id: 35, nombre: 'Comedia' },
      { id: 27, nombre: 'Terror' },
      { id: 878, nombre: 'Ciencia Ficción' },
      { id: 10749, nombre: 'Romance' }
    ];

    const generosSeries = [
      { id: 'populares', nombre: 'Populares' },
      { id: 10759, nombre: 'Acción y Aventura' },
      { id: 35, nombre: 'Comedia' },
      { id: 18, nombre: 'Drama' },
      { id: 10765, nombre: 'Sci-Fi y Fantasía' },
      { id: 9648, nombre: 'Misterio' }
    ];

    function renderizarCategorias() {
      const container = document.getElementById('categoriesContainer');
      container.innerHTML = '';
      const lista = (modoActual === 'movie') ? generosPeliculas : generosSeries;

      lista.forEach(item => {
        const btn = document.createElement('button');
        btn.className = `cat-btn ${item.id === categoriaActual ? 'active' : ''}`;
        btn.innerText = item.nombre;
        btn.onclick = (e) => filtrarCategoria(item.id, e);
        container.appendChild(btn);
      });
    }

    function cambiarModo(nuevoModo) {
      if (modoActual === nuevoModo) return;
      modoActual = nuevoModo;
      categoriaActual = 'populares';
      busquedaActual = '';
      paginaActual = 1;
      document.getElementById('searchInput').value = '';

      document.getElementById('modeMovies').classList.toggle('active', modoActual === 'movie');
      document.getElementById('modeSeries').classList.toggle('active', modoActual === 'tv');

      renderizarCategorias();
      cargarCatalogo();
    }

    async function cargarCatalogo() {
      const catalogo = document.getElementById('catalogo');
      const infoCarga = document.getElementById('infoCarga');
      catalogo.innerHTML = '';
      infoCarga.innerText = modoActual === 'movie' ? "Cargando películas..." : "Cargando series...";

      const pagInicio = ((paginaActual - 1) * 2.5) + 1; 
      const p1 = Math.floor(pagInicio);
      const p2 = p1 + 1;
      const p3 = p1 + 2;

      let buildUrl = (p) => {
        const endpoint = modoActual === 'movie' ? 'movie' : 'tv';
        if (busquedaActual) {
          return `https://api.themoviedb.org/3/search/${endpoint}?api_key=${TMDB_API_KEY}&language=es-ES&query=${encodeURIComponent(busquedaActual)}&page=${p}`;
        } else if (categoriaActual !== 'populares') {
          return `https://api.themoviedb.org/3/discover/${endpoint}?api_key=${TMDB_API_KEY}&language=es-ES&with_genres=${categoriaActual}&page=${p}`;
        } else {
          return `https://api.themoviedb.org/3/${endpoint}/popular?api_key=${TMDB_API_KEY}&language=es-ES&page=${p}`;
        }
      };

      try {
        const [res1, res2, res3] = await Promise.all([
          fetch(buildUrl(p1)).then(r => r.json()).catch(() => ({ results: [] })),
          fetch(buildUrl(p2)).then(r => r.json()).catch(() => ({ results: [] })),
          fetch(buildUrl(p3)).then(r => r.json()).catch(() => ({ results: [] }))
        ]);

        let combinadas = [
          ...(res1.results || []),
          ...(res2.results || []),
          ...(res3.results || [])
        ];

        const listaCincuenta = combinadas.slice(0, 50);

        if (listaCincuenta.length > 0) {
          listaCincuenta.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => abrirReproductor(item);

            const titulo = item.title || item.name;
            const poster = item.poster_path 
              ? `https://image.tmdb.org/t/p/w500${item.poster_path}` 
              : 'https://via.placeholder.com/500x750?text=Sin+Poster';

            card.innerHTML = `
              <span class="badge">${modoActual === 'movie' ? 'Película' : 'Serie'}</span>
              <img src="${poster}" alt="${titulo}">
              <div class="card-title">${titulo}</div>
            `;
            catalogo.appendChild(card);
          });

          infoCarga.innerText = busquedaActual 
            ? `Resultados para: "${busquedaActual}" (${listaCincuenta.length} mostradas)` 
            : `Mostrando ${listaCincuenta.length} ${modoActual === 'movie' ? 'películas' : 'series'} en esta página`;
        } else {
          infoCarga.innerText = "No se encontraron resultados.";
        }

        document.getElementById('pageInfo').innerText = `Página ${paginaActual}`;
        document.getElementById('prevBtn').disabled = (paginaActual <= 1);
        document.getElementById('nextBtn').disabled = (listaCincuenta.length < 50);

      } catch (err) {
        console.error(err);
        infoCarga.innerText = "Error al conectar con el servicio.";
      }
    }

    function filtrarCategoria(generoId, event) {
      categoriaActual = generoId;
      busquedaActual = '';
      paginaActual = 1;
      document.getElementById('searchInput').value = '';
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      if (event && event.target) event.target.classList.add('active');
      cargarCatalogo();
    }

    function ejecutarBusqueda() {
      const q = document.getElementById('searchInput').value.trim();
      if (q) {
        busquedaActual = q;
        paginaActual = 1;
        document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
        cargarCatalogo();
      }
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') ejecutarBusqueda();
    }

    function cambiarPagina(delta) {
      paginaActual += delta;
      if (paginaActual < 1) paginaActual = 1;
      cargarCatalogo();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // --- LÓGICA DEL REPRODUCTOR Y SERVIDORES ---

    async function abrirReproductor(item) {
      itemActivo = item;
      servidorActivoIdx = 0;
      temporadaActiva = 1;
      episodioActivo = 1;

      document.getElementById('playerModal').style.display = 'block';

      // Configurar botones de servidores
      renderizarBotonesServidores();

      if (modoActual === 'movie') {
        document.getElementById('seriesPanel').style.display = 'none';
        actualizarIframe();
      } else {
        document.getElementById('seriesPanel').style.display = 'block';
        document.getElementById('seriesTitle').innerText = item.name || "Serie";
        await cargarEstructuraSerie(item.id);
      }
    }

    function renderizarBotonesServidores() {
      const container = document.getElementById('serverContainer');
      container.innerHTML = '';

      SERVIDORES.forEach((srv, idx) => {
        const btn = document.createElement('button');
        btn.className = `server-btn ${idx === servidorActivoIdx ? 'active' : ''}`;
        btn.innerText = srv.nombre;
        btn.onclick = () => cambiarServidor(idx, btn);
        container.appendChild(btn);
      });
    }

    function cambiarServidor(index, btn) {
      servidorActivoIdx = index;
      document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      actualizarIframe();
    }

    function actualizarIframe() {
      const iframe = document.getElementById('embedFrame');
      const srv = SERVIDORES[servidorActivoIdx];

      if (modoActual === 'movie') {
        iframe.src = srv.getMovie(itemActivo.id);
      } else {
        iframe.src = srv.getTv(itemActivo.id, temporadaActiva, episodioActivo);
      }
    }

    // --- LÓGICA DE TEMPORADAS Y EPISODIOS (ESTILO XUPERTV/MXL) ---

    async function cargarEstructuraSerie(seriesId) {
      const selectTemp = document.getElementById('seasonSelect');
      selectTemp.innerHTML = '<option>Cargando...</option>';

      try {
        const res = await fetch(`https://api.themoviedb.org/3/tv/${seriesId}?api_key=${TMDB_API_KEY}&language=es-ES`);
        const data = await res.json();

        selectTemp.innerHTML = '';
        const temporadasValidas = (data.seasons || []).filter(s => s.season_number > 0);

        if (temporadasValidas.length > 0) {
          temporadasValidas.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.season_number;
            opt.innerText = `Temporada ${s.season_number} (${s.episode_count} eps)`;
            selectTemp.appendChild(opt);
          });

          temporadaActiva = temporadasValidas[0].season_number;
          await seleccionarTemporada(temporadaActiva);
        } else {
          document.getElementById('episodesGrid').innerHTML = '<div>No se encontraron temporadas.</div>';
        }

      } catch (err) {
        console.error(err);
        selectTemp.innerHTML = '<option>Error al cargar</option>';
      }
    }

    async function seleccionarTemporada(numTemporada) {
      temporadaActiva = parseInt(numTemporada);
      const gridEps = document.getElementById('episodesGrid');
      gridEps.innerHTML = '<div>Cargando episodios...</div>';

      try {
        const res = await fetch(`https://api.themoviedb.org/3/tv/${itemActivo.id}/season/${temporadaActiva}?api_key=${TMDB_API_KEY}&language=es-ES`);
        const data = await res.json();

        gridEps.innerHTML = '';

        if (data.episodes && data.episodes.length > 0) {
          data.episodes.forEach(ep => {
            const btn = document.createElement('button');
            btn.className = `ep-btn ${ep.episode_number === episodioActivo ? 'active' : ''}`;
            btn.innerText = `E${ep.episode_number}: ${ep.name.slice(0, 15)}...`;
            btn.title = ep.name;
            btn.onclick = () => seleccionarEpisodio(ep.episode_number, btn);
            gridEps.appendChild(btn);
          });

          // Seleccionar primer episodio por defecto
          episodioActivo = data.episodes[0].episode_number;
          actualizarIframe();
        } else {
          gridEps.innerHTML = '<div>No hay episodios disponibles.</div>';
        }

      } catch (err) {
        console.error(err);
        gridEps.innerHTML = '<div>Error al cargar episodios.</div>';
      }
    }

    function seleccionarEpisodio(numEpisodio, btn) {
      episodioActivo = numEpisodio;
      document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      actualizarIframe();
    }

    function cerrarReproductor() {
      document.getElementById('playerModal').style.display = 'none';
      document.getElementById('embedFrame').src = '';
      itemActivo = null;
    }

    // Inicialización
    renderizarCategorias();
    cargarCatalogo();
  </script>
</body>
</html>
